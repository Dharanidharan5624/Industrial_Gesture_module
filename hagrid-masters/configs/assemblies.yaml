assemblies:
- assembly_id: screw_tightening
  display_name: Industrial Screw-Tightening Assembly
  detection_mode: screw_monitor
  is_active: false
  target_params:
    turn_target: 2.5
    align_threshold_px: 50
  sop_steps:
  - index: 0
    title: Operator Verification
    description: Verify authorized operator identity and workstation readiness.
    ai_validation: Face Verification
    expected_result: Authorized Operator
    timeout: 15
    criteria: Face Matched
    warning_msg: Unauthorized operator or face not detected
    next_step: '1'
  - index: 1
    title: Safety & PPE Check
    description: Ensure gloves, uniform, safety goggles, helmet, and other required
      PPE are worn correctly.
    ai_validation: PPE Detection
    expected_result: PPE Worn
    timeout: 30
    criteria: Glove and PPE Detected
    warning_msg: Please wear hand glove and safety equipment
    next_step: '2'
  - index: 2
    title: Component Verification
    description: Confirm the correct product, component, and screw are present before
      operation begins.
    ai_validation: Face Verification
    expected_result: Components Present
    timeout: 20
    criteria: Correct Screw & Part Verified
    warning_msg: Component missing or incorrect target
    next_step: '3'
  - index: 3
    title: Tool Verification
    description: Verify the correct tool is selected and ready for operation.
    ai_validation: Tool Detection
    expected_result: Screwdriver Ready
    timeout: 20
    criteria: Tool Detected
    warning_msg: Tool not found or incorrect tool selected
    next_step: '4'
  - index: 4
    title: Tool Alignment
    description: Align the screwdriver tip accurately with the target screw before
      rotation.
    ai_validation: Tool Alignment Detection
    expected_result: Aligned
    timeout: 30
    criteria: Aligned == True
    warning_msg: Align screwdriver tip to target screw
    next_step: '5'
  - index: 5
    title: Rotation & Torque Monitoring
    description: Detect clockwise/counter-clockwise rotation, count turns, verify
      torque target, and validate SOP requirements.
    ai_validation: Rotation Count Verification
    expected_result: Target Turns Reached
    timeout: 45
    criteria: Turns >= 2.5
    warning_msg: Rotate screwdriver to target turns (2.5)
    next_step: '6'
  - index: 6
    title: Quality Verification
    description: Confirm the screw is fully tightened/loosened, tool removed safely,
      and the final assembly passes inspection.
    ai_validation: Final Quality Inspection
    expected_result: Pass
    timeout: 30
    criteria: Tightening Complete & Validated
    warning_msg: Quality inspection failed
    next_step: '7'
  - index: 7
    title: Operation Completion & Logging
    description: Capture the final image, save logs, update production records, and
      mark the SOP as completed.
    ai_validation: Database & Screenshot Logging
    expected_result: Logged
    timeout: 10
    criteria: Screenshot saved and DB entry written
    warning_msg: Failed to write log records
    next_step: End
- assembly_id: air_filter_fit
  display_name: Air Filter Check & Fitting
  detection_mode: air_filter_monitor
  is_active: false
  target_params:
    pressing_duration_sec: 2.0
    work_area_roi:
    - 100
    - 100
    - 500
    - 400
    finished_area_roi:
    - 500
    - 100
    - 640
    - 400
  sop_steps:
  - index: 0
    title: Operator Verification
    description: Verify authorized operator identity and workstation readiness.
    ai_validation: Face Verification
    expected_result: Authorized Operator
    timeout: 15
    criteria: Face Matched
    warning_msg: Unauthorized operator or face not detected
    next_step: '1'
  - index: 1
    title: Safety & PPE Check
    description: Ensure gloves, uniform, safety goggles, helmet, and required PPE
      are worn correctly.
    ai_validation: PPE Detection
    expected_result: PPE Worn
    timeout: 30
    criteria: Glove and PPE Detected
    warning_msg: Please wear hand glove and safety equipment
    next_step: '2'
  - index: 2
    title: Pick & Inspect Air Filter
    description: Pick up the raw air filter frame and visually check for cracks, deformities,
      or foreign debris.
    ai_validation: Face Verification
    expected_result: Air Filter Present & Intact
    timeout: 30
    criteria: Air Filter Detected
    warning_msg: Air filter missing or invalid orientation
    next_step: '3'
  - index: 3
    title: Position Air Filter in Workstation
    description: Place the air filter securely on the mounting fixture in the primary
      assembly area.
    ai_validation: Face Verification
    expected_result: Filter Placed in ROI
    timeout: 30
    criteria: Filter Bounding Box inside Work ROI
    warning_msg: Place air filter into designated fixture zone
    next_step: '4'
  - index: 4
    title: Verify Side A Alignment
    description: Ensure Side A faces upward and alignment notches engage fixture pins.
    ai_validation: Face Verification
    expected_result: Side A Oriented Correctly
    timeout: 20
    criteria: Alignment Notches Verified
    warning_msg: Re-align filter Side A with fixture pins
    next_step: '5'
  - index: 5
    title: Insert Temporary Locator Pins (Side A)
    description: Insert temporary guide pins into Side A corner brackets to prevent
      displacement during mounting.
    ai_validation: Face Verification
    expected_result: Pins Inserted
    timeout: 30
    criteria: Side A Pins Detected in Holes
    warning_msg: Insert locator pins into Side A corners
    next_step: '6'
  - index: 6
    title: Apply Adhesive / Sealant (Side A)
    description: Dispense industrial sealant along Side A perimeter channel.
    ai_validation: Face Verification
    expected_result: Sealant Bead Applied
    timeout: 45
    criteria: Dispensing Trajectory Verified
    warning_msg: Apply sealant continuously along Side A channel
    next_step: '7'
  - index: 7
    title: Pick & Position Rubber Mount 1
    description: Retrieve the first rubber mount from component tray A and align over
      Side A bracket.
    ai_validation: Face Verification
    expected_result: Mount 1 in Hand
    timeout: 25
    criteria: Rubber Mount Detected in ROI
    warning_msg: Retrieve rubber mount 1 from tray A
    next_step: '8'
  - index: 8
    title: Press & Lock Rubber Mount 1
    description: Press Mount 1 firmly into Side A bracket until locking tabs fully
      engage (hold 2 sec).
    ai_validation: Face Verification
    expected_result: Mount 1 Locked
    timeout: 30
    criteria: Downward Force & Engagement Confirmed
    warning_msg: Apply firm downward press until locked
    next_step: '9'
  - index: 9
    title: Remove Temporary Locator Pins (Side A)
    description: Remove temporary guide pins from Side A brackets and return to pin
      holder.
    ai_validation: Face Verification
    expected_result: Side A Pins Removed
    timeout: 25
    criteria: Pins Cleared from Fixture
    warning_msg: Remove guide pins from Side A before turning
    next_step: '10'
  - index: 10
    title: Rotate Air Filter to Side B
    description: Carefully lift and flip the air filter 180 degrees to expose Side
      B for mounting.
    ai_validation: Face Verification
    expected_result: Filter Flipped to Side B
    timeout: 30
    criteria: 180 Degree Flip Trajectory Detected
    warning_msg: Rotate filter 180 degrees to access Side B
    next_step: '11'
  - index: 11
    title: Position & Verify Side B Alignment
    description: Seat Side B onto fixture and verify orientation and pin registration.
    ai_validation: Face Verification
    expected_result: Side B Oriented Correctly
    timeout: 20
    criteria: Side B Alignment Verified
    warning_msg: Ensure Side B is flat against workstation
    next_step: '12'
  - index: 12
    title: Insert Temporary Locator Pins (Side B)
    description: Insert temporary guide pins into Side B corner brackets.
    ai_validation: Face Verification
    expected_result: Side B Pins Inserted
    timeout: 30
    criteria: Side B Pins Detected
    warning_msg: Insert locator pins into Side B corners
    next_step: '13'
  - index: 13
    title: Apply Adhesive / Sealant (Side B)
    description: Dispense industrial sealant along Side B perimeter channel.
    ai_validation: Face Verification
    expected_result: Sealant Bead Applied
    timeout: 45
    criteria: Dispensing Trajectory Verified
    warning_msg: Apply sealant continuously along Side B channel
    next_step: '14'
  - index: 14
    title: Pick & Position Rubber Mount 2
    description: Retrieve second rubber mount from component tray B and align over
      Side B bracket.
    ai_validation: Face Verification
    expected_result: Mount 2 in Hand
    timeout: 25
    criteria: Rubber Mount Detected in ROI
    warning_msg: Retrieve rubber mount 2 from tray B
    next_step: '15'
  - index: 15
    title: Press & Lock Rubber Mount 2
    description: Press Mount 2 firmly into Side B bracket until locking tabs fully
      engage.
    ai_validation: Face Verification
    expected_result: Mount 2 Locked
    timeout: 30
    criteria: Downward Force & Engagement Confirmed
    warning_msg: Apply firm downward press until locked
    next_step: '16'
  - index: 16
    title: Remove Temporary Locator Pins (Side B)
    description: Remove temporary guide pins from Side B brackets.
    ai_validation: Face Verification
    expected_result: Side B Pins Removed
    timeout: 25
    criteria: Side B Pins Cleared
    warning_msg: Remove guide pins from Side B
    next_step: '17'
  - index: 17
    title: Verify Adhesive Bonding & Curing
    description: Inspect both Side A and Side B mount seats for proper adhesive spread
      and bond gap.
    ai_validation: Face Verification
    expected_result: Bond Line Verified
    timeout: 30
    criteria: Dual-Side Sealant Spread Validated
    warning_msg: Check for incomplete adhesive coverage
    next_step: '18'
  - index: 18
    title: Clean Workstation & Remove Fixtures
    description: Clear tools, excess sealant wipes, and return locator pins to storage
      rack.
    ai_validation: None
    expected_result: Work Area Clean
    timeout: 20
    criteria: Workstation Clear
    warning_msg: Clear assembly area before final inspection
    next_step: '19'
  - index: 19
    title: Dual-Side Final Quality Inspection & Logging
    description: AI visual audit of Side A, Side B, mount seatings, adhesive seals,
      and write log record.
    ai_validation: Face Verification
    expected_result: Full Pass & Logged
    timeout: 30
    criteria: Inspection Pass & Log Saved
    warning_msg: Dual-side quality check failed
    next_step: End
- assembly_id: air_filter_pack
  display_name: Air Filter Quality Check & Packing
  detection_mode: stub
  is_active: false
  target_params: {}
  sop_steps:
  - index: 0
    title: Operator Verification
    description: Verify authorized operator identity and workstation readiness.
    ai_validation: Face Verification
    expected_result: Authorized Operator
    timeout: 15
    criteria: Face Matched
    warning_msg: Unauthorized operator or face not detected
    next_step: '1'
  - index: 1
    title: Visual Quality Inspection
    description: Inspect the air filter for surface defects, tears, contamination,
      or dimensional non-conformances.
    ai_validation: Final Quality Inspection
    expected_result: Pass — No Defects
    timeout: 45
    criteria: Visual Inspection Passed
    warning_msg: Defect or contamination detected — do not pack
    next_step: '2'
  - index: 2
    title: Dimensional Verification
    description: Verify filter dimensions against specified tolerances using measurement
      tool or reference jig.
    ai_validation: None
    expected_result: Dimensions Within Tolerance
    timeout: 30
    criteria: Dimensional Check Passed
    warning_msg: Dimensions out of tolerance — reject and quarantine
    next_step: '3'
  - index: 3
    title: Packing & Label Check
    description: Pack the filter in the correct packaging, apply the label, and verify
      label information is accurate.
    ai_validation: OCR Verification
    expected_result: Label Verified
    timeout: 30
    criteria: Correct Label Applied
    warning_msg: Label mismatch or missing — re-print and re-apply
    next_step: '4'
  - index: 4
    title: Final Packing Completion & Logging
    description: Seal the package, capture the final image, save logs, and mark the
      SOP as completed.
    ai_validation: Database & Screenshot Logging
    expected_result: Logged
    timeout: 10
    criteria: Screenshot saved and DB entry written
    warning_msg: Failed to write log records
    next_step: End
- assembly_id: product_weight_check
  display_name: product weight check
  detection_mode: stub
  is_active: false
  target_params: {}
  sop_steps: []
